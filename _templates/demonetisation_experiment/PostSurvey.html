{{ extends 'global/Page.html' }}

{{ block title }}Post-Experiment Survey{{ endblock }}

{{ block content }}
<div class="card stagger-1">
    <div class="card-header bg-primary text-white">
        <div class="icon-header">
            <svg class="icon icon-md icon-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
                <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
            </svg>
            <h4 class="mb-0" style="color: #fff;">Thank You! Please Answer a Few Final Questions</h4>
        </div>
    </div>
    <div class="card-body">
        <p>Your responses will help us understand decision-making patterns. All answers are optional.</p>

        {{ formfields }}

        {{ next_button }}
    </div>
</div>
{{ endblock }}
