{{ extends 'global/Page.html' }}

{{ block title }}Tax Attitudes{{ endblock }}

{{ block content }}
<div class="card stagger-1">
    <div class="card-header bg-primary text-white">
        <div class="icon-header">
            <svg class="icon icon-md icon-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="1" x2="12" y2="23"/>
                <path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/>
            </svg>
            <h4 class="mb-0" style="color: #fff;">Your Attitudes Toward Taxes</h4>
        </div>
    </div>
    <div class="card-body">
        <p>Please indicate your level of agreement with each statement on a scale from 1 (Strongly Disagree) to 7 (Strongly Agree).</p>
        
        {{ formfields }}

        {{ next_button }}
    </div>
</div>
{{ endblock }}
